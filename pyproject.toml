[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msalgcm-optimize"
version = "0.1.0"
description = "Comparative metaheuristic optimization platform (SA, TS, PSO)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "scikit-learn>=1.4",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
optimize = "optimize.ui.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
