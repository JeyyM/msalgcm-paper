# Living decision registry — update when research choices are locked.
# See documentation v1.md and old documentation/pipeline_definition.md

decisions:
  D1_language:
    status: resolved
    value: "Python 3.11+"
    notes: "Approved for Phase 0 scaffold"

  D2_ui:
    status: resolved
    value: "React dashboard (web/frontend) + FastAPI backend; CLI retained"
    notes: "optimize serve for API; npm run dev in web/frontend for UI"

  D3_storage:
    status: resolved
    value: "File-only (JSON + CSV)"
    notes: null

  D4_tsp_data:
    status: resolved
    value: "TSPLIB via datasets/tsp/instances/ (6 active instances)"
    tuning_instances: [eil51, berlin52, st70]
    comparison_instances: [kroA100, ch130, rat195]
    removed_instances: [kroB100, tsp225]
    removed_path: "datasets/tsp/removed/"
    format: "TSPLIB .tsp (EUC_2D)"
    known_optima: "datasets/tsp/metadata.json"

  D5_tsp_operators:
    status: resolved
    value:
      - swap
      - insertion
      - inversion
      - two_opt
    two_opt_policy: "standard move operator (not hybrid local search add-on)"

  D6_scheduling:
    status: resolved
    formulation: "classic job-shop (JSP)"
    benchmark: "Taillard via datasets/scheduling/jsp/instances/"
    representation: "operation sequence + serial schedule decoder (SSGS)"
    verify_before_phase_3:
      - "Confirm ta21 dimensions match literature (SchedulingLab shows 20x20) — CONFIRMED 20x20 (audit, 2026-08-07)"

  D7_scheduling_benchmarks:
    status: resolved
    instances:
      - ft10
      - ta01
      - ta21
      - ta31
      - ta41
      - ta51
      - ta71
    tuning_instances: [ft10, ta01, ta21]
    comparison_instances: [ta31, ta51, ta71]
    excluded_from_split: [ta41]
    excluded_reason: "ta41 has null best_known_makespan in datasets/scheduling/jsp/metadata.json — gap % cannot be computed; still runnable ad hoc, excluded from formal tune/compare protocol"

  D13_jsp_tuning_protocol:
    status: resolved
    value: "config/tuning/jsp_tuning_protocol.json"
    tuning_instances: [ft10, ta01, ta21]
    comparison_instances: [ta31, ta51, ta71]
    initial_solution: longest_processing_time
    runs_per_config: 5
    final_comparison_runs: 30
    evaluation_budget: 50000
    selection_metric: mean_gap_percentage
    literature: "van Laarhoven et al. (1992) SA schedule; Nowicki & Smutnicki (1996) / Watson et al. (2006) TS tenure ~8 — see literature/algorithm_parameter_literature.md"
    notes: >
      Same initial_solution used for tuning AND final comparison (unlike TSP v1/v2,
      which mismatched NN vs random and needed a confirmation pass) — avoids that rework.
    frozen_winners: "results/tuning/jsp_selected_parameters.json (2026-08-07) — applied to config/examples/jsp_ft10_comparison.json"

  D8_fs_datasets:
    status: resolved
    raw: "datasets/feature_selection/raw/"
    ew: "datasets/feature_selection/ew/"
    ew_provenance: >
      EW CSVs built from OpenML + equal-width k=5 discretization (Hall & Holmes style).
      SpectEW uses native binary UCI SPECT train+test merge.

  D9_fs_ml_design:
    status: resolved
    classifier: "k-NN (sklearn)"
    cv: "stratified k-fold on training data"
    primary_metric: "accuracy"
    multiclass_metric: "macro-F1 for WineEW"
    objective_weights:
      performance_weight: "configurable; no silent default in experiments"
      reduction_weight: "configurable"
    madelon_split: "Use official train/valid/test from UCI — never optimize on test"
    spect_split: "stratified holdout via domain_config.test_size + split_seed from seed_policy.base_seed"
    loader_bug_fixed: >
      2026-08-07 audit: ZooEW, LymphographyEW, SonarEW, IonosphereEW had string class
      labels (e.g. "mammal", "Rock") that crashed load_ew_dataset (expected numeric).
      Fixed in src/optimize/domains/feature_selection/loader.py via deterministic
      sorted-string label encoding; verified all 8 EW datasets now load with correct
      num_classes. These 4 datasets could not have produced any valid result before
      this fix — no prior results exist for them, so nothing needed a rerun.

  D14_fs_tuning_protocol:
    status: resolved
    value: "config/tuning/fs_tuning_protocol.json"
    tuning_datasets: [ZooEW, IonosphereEW, SonarEW]
    comparison_datasets: [BreastEW, WineEW, LymphographyEW, SpectEW, MadelonEW]
    initial_solution: random
    runs_per_config: 5
    final_comparison_runs: 30
    evaluation_budget: 5000
    selection_metric: mean_best_objective
    literature: >
      Kohavi & John (1997) wrapper concept; Xue, Zhang & Browne (2013) PSO-FS ranges;
      Ma et al. (2023) tabu tenure ~n/2 for wrapper FS — see
      literature/algorithm_parameter_literature.md
    notes: >
      No known-optimum concept for FS, so selection metric is mean best_objective
      (already a bounded [0,1] weighted CV-loss + reduction score) rather than gap %.
      Tuning set spans small/medium feature counts (16/34/60); MadelonEW (500
      features) held out for comparison only as the large-scale stress test.
    frozen_winners: "results/tuning/fs_selected_parameters.json (2026-08-07) — applied to config/examples/fs_breastew_comparison.json"
    pso_dimension_bug_fixed: >
      2026-08-07: PSO had never worked on feature_selection (any dataset) — every run
      crashed with "unable to infer PSO dimension from problem" because
      FeatureSelectionProblem exposed neither `.instance` nor `.dimension`. Fixed by
      adding a `dimension` property to FeatureSelectionProblem
      (src/optimize/domains/feature_selection/problem.py). No prior PSO×FS results
      existed anywhere in the repo, so nothing needed a rerun beyond the 12 tuning
      groups affected (deleted and rerun clean). Added regression test
      test_fs_pso_smoke in tests/test_feature_selection.py.

  D10_experimental_design:
    status: open
    runs: "configurable per experiment JSON"
    evaluation_budget: "configurable per experiment JSON"
    size_tiers: "configurable; see dataset metadata"

  D11_statistics:
    status: open
    value: "Export CSV for external analysis until tests approved"

  D12_tuning_protocol:
    status: resolved
    value: "config/tuning/tsp_tuning_protocol_v2.json (supersedes v1)"
    tuning_instances: [eil51, berlin52, st70]
    comparison_instances: [kroA100, ch130, rat195]
    removed_instances: [kroB100, tsp225]
    removed_path: datasets/tsp/removed/
    initial_solution: random
    runs_per_config: 5
    final_comparison_runs: 30
    evaluation_budget: 100000
    selection_metric: mean_gap_percentage
    documentation: old documentation/tuning_documentation.md
    notes: >
      v2 uses random initial tours so metaheuristics can improve from weak starts.
      v1 nearest-neighbor tuning retained under results/tuning for reference.
      TS and PSO frozen via NN confirmation (tsp_tuning_confirm_nn.json) in results/tuning/nn_confirm/.

first_build_target:
  phase: "TSP vertical slice"
  path: "Phase 0 → 1 → 2 → minimal runner → CLI"
